services:
  postgres:
    image: postgres:16-alpine
    container_name: recipe-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-recipe_app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  localstack:
    image: localstack/localstack
    container_name: recipe-localstack
    environment:
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:?Set LOCALSTACK_AUTH_TOKEN in your ignored .env}
      SERVICES: s3
      PERSISTENCE: "1"
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4566/_localstack/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  s3-init:
    build:
      context: ./backend
    container_name: recipe-s3-init
    working_dir: /app
    depends_on:
      localstack:
        condition: service_healthy
    command: ["python", "-m", "app.s3_init"]
    environment:
      S3_ENDPOINT: http://localstack:4566
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-test}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-test}

  ollama:
    image: ollama/ollama:latest
    container_name: recipe-ollama
    ports:
      - "11434:11434"
    environment:
      OLLAMA_KEEP_ALIVE: "24h"
    volumes:
      - ollama_data:/root/.ollama
    command: >
      /bin/sh -c "ollama serve &
      sleep 15 &&
      ollama pull ${OLLAMA_MODEL:-qwen2.5-coder:14b} &&
      wait"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.22
    container_name: recipe-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8025/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./backend
    container_name: recipe-api
    working_dir: /app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_NAME: ${APP_NAME:-recipe-api}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://app:app_password@postgres:5432/recipe_app}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://localstack:4566}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:4566}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-test}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-test}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:14b}
      MAILPIT_SMTP_HOST: ${MAILPIT_SMTP_HOST:-mailpit}
      MAILPIT_SMTP_PORT: ${MAILPIT_SMTP_PORT:-1025}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
      ollama:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()\""]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    container_name: recipe-worker
    working_dir: /app
    command: python -m app.worker
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_NAME: ${APP_NAME:-recipe-worker}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://app:app_password@postgres:5432/recipe_app}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://localstack:4566}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:4566}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-test}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-test}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:14b}
      MAILPIT_SMTP_HOST: ${MAILPIT_SMTP_HOST:-mailpit}
      MAILPIT_SMTP_PORT: ${MAILPIT_SMTP_PORT:-1025}
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
      ollama:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os; print('ok')\" >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: recipe-frontend
    working_dir: /app
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      VITE_APP_NAME: ${VITE_APP_NAME:-Recipe App}
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5173').then(() => process.exit(0)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  localstack_data:
  ollama_data:
